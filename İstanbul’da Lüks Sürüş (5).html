<html lang="tr"><head><meta charset="utf-8">

<title>İstanbul’da Lüks Sürüş</title>
<style>
:root{--ink:#f5efe3;--gold:#d9b86c;--glass:rgba(9,13,25,.62);--bg:#0a0e1a}
*{box-sizing:border-box}

canvas#c{display:block}
.p{position:fixed;background:var(--glass);backdrop-filter:blur(6px);border:1px solid rgba(217,184,108,.35);border-radius:10px}
#info{left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:9px 14px;line-height:1.35}
#info b{font-size:17px;color:var(--gold);font-weight:normal;letter-spacing:.02em}
#info span{font-size:13px;opacity:.85}
#mini{right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:130px;height:104px}
#spd{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:6px 16px;text-align:right}
#spd i{font-style:normal;font-size:44px;color:var(--gold)}#spd small{font-size:13px;opacity:.8;margin-left:4px}
#btns{left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:6px;background:none;border:0;backdrop-filter:none}
button{font:inherit;color:var(--ink);background:var(--glass);border:1px solid rgba(217,184,108,.5);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover,button:focus-visible{background:rgba(217,184,108,.25);outline:none}
#touch{display:none;position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));justify-content:space-between;padding:0 14px;pointer-events:none}
#touch div{display:flex;gap:10px;pointer-events:auto}
#touch button{width:74px;height:74px;font-size:22px;border-radius:50%;padding:0}
@media (pointer:coarse){#touch{display:flex}#btns{bottom:calc(14px + env(safe-area-inset-bottom,0px))}#spd{bottom:calc(160px + env(safe-area-inset-bottom,0px))}}
#toast{left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:8px 16px;display:none}#touch button.pl{display:none}body.pl #touch button.pl{display:block}#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(60,40,30,.82),rgba(6,8,16,.96))}
#menu h1{font-weight:normal;font-size:clamp(28px,6vw,52px);margin:0;color:var(--gold);letter-spacing:.03em}
#menu p{margin:0 0 6px;opacity:.85}
#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;max-width:760px;width:100%;max-height:52vh;overflow:auto}
#list button{text-align:left;padding:12px 14px;display:flex;align-items:center;gap:10px}
#list s{width:16px;height:16px;border-radius:50%;border:1px solid #fff8;flex:none}
#menu small{opacity:.65;max-width:560px}
</style></head><body>
<canvas id="c"></canvas>
<div id="info" class="p"><b id="cn"></b><br><span id="loc"></span></div>
<canvas id="mini" class="p" width="130" height="104"></canvas>
<div id="spd" class="p"><i id="kmh">0</i><small>km/sa</small></div>
<div id="btns" class="p"><button id="bf">Bin / in (F)</button><button id="bcar">Araç değiştir</button><button id="btime">Saat</button></div><div id="toast" class="p"></div>
<div id="touch"><div><button data-k="left">◀</button><button data-k="right">▶</button></div><div><button class="pl" data-k="pd">▼</button><button class="pl" data-k="pu">▲</button><button data-k="down">Fren</button><button data-k="up">Gaz</button></div></div>
<div id="menu"><h1>İstanbul’da Lüks Sürüş</h1><p>Aracını seç, Boğaz Köprüsü’nü geç.</p><div id="list"></div><small>W A S D veya ok tuşları ile sür · Boşluk: el freni · N: günün saati · R: başa dön · C: araç menüsü · F: araçtan in, uçağa ya da vapura bin · Shift: koş · Uçakta W/S gaz, ↓ burun yukarı</small></div>

function roadTex(){const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");

x.fillStyle="#cfcfc8";x.fillRect(0,3,256,2);x.fillRect(0,59,256,2);x.fillStyle="#e8c35a";x.fillRect(8,31,110,2);

const RT=roadTex();

g.translate(x,h/2,z);const a=acc[k];for(const v of g.attributes.position.array)a.p.push(v);for(const v of g.attributes.normal.array)a.n.push(v);for(const v of u.array)a.u.push(v);
C.push([x-w/2,x+w/2,z-d/2,z+d/2])}
const cxs=[-330,-270,-210,-150,-90,-30,30,390,450,510];
for(const cx of cxs)for(let cz=-330;cz<=330;cz+=60){
 if((cx==-30&&cz==-150)||(cx==-90&&cz==90))continue;
 for(const sx of[-1,1])for(const sz of[-1,1]){if(Math.random()<.12)continue;
  const w=14+Math.random()*7,d=14+Math.random()*7,big=Math.random()<.1,h=(cx>200?10+Math.random()*30:12+Math.random()*45)*(big?1.9:1);
  bld(cx+sx*12,cz+sz*12,w,d,h,Math.floor(Math.random()*(big?6:5)))}}
acc.forEach((a,k)=>{const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(a.p,3));g.setAttribute("normal",new THREE.Float32BufferAttribute(a.n,3));g.setAttribute("uv",new THREE.Float32BufferAttribute(a.u,2));const m=mesh(g,PAL[k],0,0,0);m.castShadow=true;m.receiveShadow=true});

(function(){
 const stone=mat(0xe3c9a0),dm=mat(0x8d9aa5,{roughness:.5,metalness:.3}),wh=mat(0xf0ece4);

 mesh(new THREE.BoxGeometry(34,14,34),stone,0,7,0,H).castShadow=true;
 mesh(new THREE.SphereGeometry(13,32,16,0,PI*2,0,PI/2),dm,0,14,0,H).castShadow=true;
 [-1,1].forEach(s=>mesh(new THREE.SphereGeometry(9,24,12,0,PI*2,0,PI/2),dm,0,12,s*17,H));
 [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{mesh(new THREE.CylinderGeometry(1,1.3,38,14),wh,a*21.5,19,b*21.5,H).castShadow=true;
  mesh(new THREE.CylinderGeometry(1.9,1.9,.5,14),stone,a*21.5,30,b*21.5,H);mesh(new THREE.ConeGeometry(1.5,6,14),dm,a*21.5,41,b*21.5,H)});
 C.push([-54,-6,-174,-126]);
 const G=new THREE.Group();G.position.set(-90,0,90);S.add(G);
 mesh(new THREE.CylinderGeometry(5,5.6,32,24),mat(0xcdbba0),0,16,0,G).castShadow=true;
 mesh(new THREE.CylinderGeometry(7,7,1.2,24),stone,0,32.6,0,G);mesh(new THREE.CylinderGeometry(5.6,5.6,5,24),mat(0xd8c7a8),0,35.7,0,G);
 mesh(new THREE.ConeGeometry(6.4,9,24),mat(0x6e7f86,{metalness:.3}),0,42.7,0,G);C.push([-97,-83,83,97]);
 const M=new THREE.Group();M.position.set(200,0,-110);S.add(M);
 mesh(new THREE.CylinderGeometry(7,8,3,20),mat(0x777b78),0,-.5,0,M);mesh(new THREE.CylinderGeometry(2.6,3,9,16),wh,0,5,0,M);
 mesh(new THREE.CylinderGeometry(3.6,3,2.6,16),wh,0,10.5,0,M);mesh(new THREE.ConeGeometry(2.4,3.6,16),mat(0xb33a2e),0,13.4,0,M);
})();
/* ---------- köprü ---------- */
var BRS=[];function bh(x,z){let m=0;for(const b of BRS){const dx=x-b.ox,dz=z-b.oz,u=Math.abs(dx*b.ux+dz*b.uz),v=Math.abs(-dx*b.uz+dz*b.ux);if(v<7.5&&u<b.half+70)m=Math.max(m,u<b.half?8:8*(b.half+70-u)/70)}return m}
function brName(x,z){for(const b of BRS){const dx=x-b.ox,dz=z-b.oz;if(Math.abs(dx*b.ux+dz*b.uz)<b.half+70&&Math.abs(-dx*b.uz+dz*b.ux)<10)return b.n}return ""}
const hAt=(x,z)=>{const q=bh(x,z);if(q)return q;if(Math.abs(z)>7.5||x<60||x>340)return 0;if(x<130)return 8*(x-60)/70;if(x<=270)return 8;return 8*(340-x)/70};
const conc=mat(0xbdbdb6);
function seg(cx,cy,len,rz){const g=new THREE.Group();g.position.set(cx,cy,0);g.rotation.z=rz;S.add(g);
 mesh(new THREE.BoxGeometry(len,.8,16),rmat(len),0,-.4,0,g).receiveShadow=true;
 [-1,1].forEach(s=>mesh(new THREE.BoxGeometry(len,1.1,.5),conc,0,.55,s*7.7,g).castShadow=true)}
const ang=Math.atan2(8,70),rl=Math.hypot(70,8)+.4;
seg(95,4,rl,ang);seg(200,8,140,0);seg(305,4,rl,-ang);
const steel=mat(0xdadada,{metalness:.5,roughness:.4}),cab=mat(0xffffff,{emissive:0xff0000,emissiveIntensity:0,metalness:.4,roughness:.4});
[140,260].forEach(x=>{[-1,1].forEach(s=>mesh(new THREE.BoxGeometry(2.4,62,2.4),steel,x,29,s*9.5).castShadow=true);
 mesh(new THREE.BoxGeometry(2,2.2,21.4),steel,x,40,0);mesh(new THREE.BoxGeometry(2,2.2,21.4),steel,x,58,0);
 [-1,1].forEach(s=>mesh(new THREE.SphereGeometry(.7,10,8),new THREE.MeshBasicMaterial({color:0xff2a2a}),x,61.5,s*9.5))});
const hp=[];
[-1,1].forEach(s=>{const pts=[];for(let t=-1;t<=1.001;t+=.05)pts.push(new THREE.Vector3(200+60*t,12+47*t*t,s*9.5));
 mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),60,.35,6),cab,0,0,0);
 for(let t=-.9;t<=.91;t+=.1)hp.push(200+60*t,12+47*t*t,s*9.5,200+60*t,8,s*8.2);
 [[140,62],[260,338]].forEach(([a,b])=>mesh(new THREE.TubeGeometry(new THREE.LineCurve3(new THREE.Vector3(a,59,s*9.5),new THREE.Vector3(b,2,s*9.5)),1,.3,6),cab,0,0,0))});
const hg=new THREE.BufferGeometry();hg.setAttribute("position",new THREE.Float32BufferAttribute(hp,3));S.add(new THREE.LineSegments(hg,new THREE.LineBasicMaterial({color:0xcfcfcf})));
/* ---------- lambalar ---------- */
const lp=[];for(let x=-350;x<=50;x+=25)lp.push([x,0,6.9],[x,0,-6.9]);for(let x=350;x<=550;x+=25)lp.push([x,0,6.9],[x,0,-6.9]);
for(let x=70;x<=330;x+=20)lp.push([x,hAt(x,0)+1.1,7.7],[x,hAt(x,0)+1.1,-7.7]);

const poles=new THREE.InstancedMesh(pg,mat(0x30343a),lp.length),bulbM=mat(0x333333,{emissive:0xffd27a,emissiveIntensity:0}),bulbs=new THREE.InstancedMesh(new THREE.SphereGeometry(.38,8,6),bulbM,lp.length),mx=new THREE.Matrix4();
lp.forEach((p,i)=>{mx.makeTranslation(p[0],p[1],p[2]);poles.setMatrixAt(i,mx);mx.makeTranslation(p[0],p[1]+6.1,p[2]);bulbs.setMatrixAt(i,mx)});S.add(poles,bulbs);
const PLT=(()=>{const c=document.createElement("canvas");c.width=128;c.height=32;const x=c.getContext("2d");x.fillStyle="#f4f4f0";x.fillRect(0,0,128,32);x.fillStyle="#1d4fa8";x.fillRect(0,0,14,32);x.fillStyle="#fff";x.font="bold 9px Georgia";x.textAlign="center";x.fillText("TR",7,26);x.fillStyle="#111";x.font="bold 20px Georgia";x.fillText("34 TR 777",72,23);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return new THREE.MeshBasicMaterial({map:t})})();
const LC={};
function logoTex(n){const k=/Rolls/.test(n)?"rr":/Bentley/.test(n)?"b":/Mercedes/.test(n)?"mb":/Lambo/.test(n)?"l":/Range/.test(n)?"lr":"";if(!k)return null;if(LC[k])return LC[k];
 const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");x.translate(64,64);x.lineWidth=5;x.strokeStyle="#e8e8e8";x.textAlign="center";x.textBaseline="middle";

/* ---------- araba modeli ---------- */

 [-1,1].forEach(s=>add(new THREE.BoxGeometry(.18,.12,.1),paint,s*(W/2+.08),by+H*.6+.14,L*.14));

 [-1,1].forEach(s=>{add(new THREE.BoxGeometry(.09,cb,.12),blk,s*W*.43,fl+cb/2,fz-.05).rotation.x=-.35;add(new THREE.BoxGeometry(.5,.14,.5),st2,s*W*.24,fl+.12,-L*.1);add(new THREE.BoxGeometry(.5,.6,.1),st2,s*W*.24,fl+.4,-L*.1-.28);add(new THREE.BoxGeometry(.3,.18,.1),st2,s*W*.24,fl+.78,-L*.1-.34)});
